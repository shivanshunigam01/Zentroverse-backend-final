# Example: /etc/nginx/sites-available/backend.zentrosure.com
# CORS is handled by Node (Express) — do NOT add add_header Access-Control-* here
# unless you know you need a static fallback.

server {
    listen 443 ssl http2;
    server_name backend.zentrosure.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
    }
}
